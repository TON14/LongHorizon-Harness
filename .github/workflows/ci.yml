# Continuous integration for LongHorizon-Harness.
#
# This workflow is the machine-checked form of `make check`: on every push or
# pull request against main it runs the same three targets a contributor runs
# before pushing, by calling the Makefile rather than restating its recipes,
# so the Makefile stays the single definition of what "green" means. The only
# raw command spelled out here is the Web dependency install, which has to
# match package-lock.json; the editable Python install goes through
# `make install-py` because test-py's require-py-deps guard expects it to
# already exist on a fresh runner.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minimum toolchain versions, mirroring the Makefile's PYTHON_MIN/NODE_MIN.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Fresh-runner prerequisites the Makefile's require-* guards assume.
      - run: npm ci --prefix frontend/web --no-audit --no-fund
      - run: make install-py

      # The targets themselves -- the same three runs `make check` performs.
      - run: make test-py
      - run: make test-web
      - run: make typecheck PYTHON=python3
