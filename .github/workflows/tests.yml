name: 🧪 Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: 🐍 ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both supported platforms, on the one interpreter the project
        # promises: requires-python is also the CI floor. The suite needs no
        # Node toolchain -- the Web bundle is a packaging artifact, not a
        # test dependency.
        os: [ubuntu-latest, windows-latest]
        python: ["3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: 📦 Install with test dependencies
        run: python -m pip install -e ".[test]"

      - name: 🧪 Run the suite
        # The Windows symlink fixtures skip themselves when the runner lacks
        # SeCreateSymbolicLinkPrivilege; those skips are expected and green.
        run: python -m pytest -q

  web:
    name: 🕸️ Frontend core and Web app types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 📦 Install the Web app dependencies
        run: npm ci --prefix frontend/web --no-audit --no-fund

      - name: 🧪 Run the shared frontend suite
        run: npm test --prefix frontend/web

      - name: 🔍 Type-check the Web app
        run: npm run typecheck --prefix frontend/web
